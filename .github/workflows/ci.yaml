name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '39 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags golden

  # The oldest Flutter that pubspec.yaml effectively accepts. The flutter line
  # says 3.10.0, but the Dart ^3.9.0 constraint first shipped in Flutter 3.35.0
  # and pub refuses anything older; 3.35.7 is the last patch of that release.
  # Code that leans on a newer API fails here before someone on the floor
  # finds it.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
      - run: flutter pub get
      # test/semantics_test.dart and example/test/screen_reader_transcript_test.dart
      # use isSemantics, which flutter_test only has from 3.41.0, so both are
      # left out here; the job above analyzes both and runs the first. Every
      # other Dart file, the rest of the example included, is analyzed as in
      # that job. Like that job, this one runs only the tests under test/.
      - run: |
          mapfile -t files < <(git -c core.quotePath=false ls-files '*.dart' | grep -v -e '^test/semantics_test.dart$' -e '^example/test/screen_reader_transcript_test.dart$')
          flutter analyze --fatal-infos "${files[@]}"
      - run: |
          mapfile -t files < <(git -c core.quotePath=false ls-files 'test/*_test.dart' | grep -v '^test/semantics_test.dart$')
          flutter test --exclude-tags golden "${files[@]}"
