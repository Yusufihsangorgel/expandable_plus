name: expandable_plus
description: "Flutter expandable and collapsible panels with accordion groups. A successor to the expandable package with the same class names, header padding and a body-tap fix."
version: 1.2.6
repository: https://github.com/Yusufihsangorgel/expandable_plus
issue_tracker: https://github.com/Yusufihsangorgel/expandable_plus/issues
topics: [accordion, collapsible, expandable-panel, accordion-groups, expandable]

screenshots:
  - description: >-
      An accordion group with three panels, one open at a time: tapping a header
       collapses whichever was open and expands the one tapped.
    path: doc/demo.gif
  - description: >-
      One body revealed by growing its height against two views cross-fading,
      so it is visible that a shut panel here can say what an open one does not.
    path: doc/reveal-modes.png

environment:
  sdk: ^3.9.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
